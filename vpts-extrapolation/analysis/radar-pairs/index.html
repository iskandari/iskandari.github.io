<!doctype html>
<html lang="en" data-radar-pair-tabs>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar profile comparisons — Examples</title>
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;font-family:Arial,sans-serif;color:#333;background:#fff}
header{flex:none;background:#fff;border-bottom:1px solid #ddd}.document-header{max-width:1250px;margin:auto;padding:18px 24px 0}.heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:14px}h1{font-size:23px;font-weight:500;margin:0}.view-link{font-size:13px;color:#337ab7;text-decoration:none;white-space:nowrap}.view-link:hover{text-decoration:underline}
nav{display:flex;gap:3px;overflow-x:auto;margin-bottom:-1px}button{font:14px Arial,sans-serif;white-space:nowrap;cursor:pointer;background:transparent;color:#337ab7;border:1px solid transparent;border-bottom:0;border-radius:4px 4px 0 0;padding:10px 15px}button:hover{background:#f7f7f7}button[aria-selected="true"]{color:#333;background:#fff;border-color:#ddd;padding-bottom:11px}
button:focus-visible,a:focus-visible{outline:2px solid #337ab7;outline-offset:-2px}main{flex:1;min-height:0}section{height:100%}iframe{display:block;border:0;width:100%;height:100%}[hidden]{display:none!important}
@media(max-width:650px){.document-header{padding:12px 10px 0}h1{font-size:19px}.heading{gap:10px;margin-bottom:10px}button{font-size:12px;padding:9px 10px}.view-link{font-size:12px}}
</style></head>
<body><header><div class="document-header"><div class="heading"><h1>Radar profile comparisons</h1><a class="view-link" id="view-link" href="full-report.html">All nights and methods →</a></div>
<nav role="tablist" aria-label="Radar comparison sections"><button id="tab-upper-agreement" role="tab" aria-selected="false" aria-controls="panel-upper-agreement" data-pair="upper-agreement">Upper agreement</button><button id="tab-feature-importance" role="tab" aria-selected="false" aria-controls="panel-feature-importance" data-pair="feature-importance">Feature importance</button><button id="tab-heldout-profiles" role="tab" aria-selected="false" aria-controls="panel-heldout-profiles" data-pair="heldout-profiles">Held-out profiles</button><button id="tab-knkx-ksox" role="tab" aria-selected="false" aria-controls="panel-knkx-ksox" data-pair="knkx-ksox">KNKX → KSOX</button><button id="tab-kohx-khtx" role="tab" aria-selected="false" aria-controls="panel-kohx-khtx" data-pair="kohx-khtx">KOHX → KHTX</button></nav></div>
</header>
<main>
<section id="panel-heldout-profiles" role="tabpanel" aria-labelledby="tab-heldout-profiles" hidden><iframe title="Held-out measured profiles and predictions" data-src="heldout-profiles.html"></iframe></section>
<section id="panel-feature-importance" role="tabpanel" aria-labelledby="tab-feature-importance" hidden><iframe title="Feature importance and deep extrapolation" data-src="feature-importance.html"></iframe></section>
<section id="panel-upper-agreement" role="tabpanel" aria-labelledby="tab-upper-agreement" hidden><iframe title="Upper-profile agreement across radar pairs" data-src="upper-agreement.html"></iframe></section>
<section id="panel-knkx-ksox" role="tabpanel" aria-labelledby="tab-knkx-ksox" hidden><iframe title="KNKX–KSOX Examples" data-src="knkx-ksox-examples.html"></iframe></section>
<section id="panel-kohx-khtx" role="tabpanel" aria-labelledby="tab-kohx-khtx" hidden><iframe title="KOHX–KHTX Examples" data-src="kohx-khtx-examples.html"></iframe></section>
</main>
<noscript><p><a href="kohx-khtx-examples.html">KOHX–KHTX</a> · <a href="upper-agreement.html">Upper agreement</a> · <a href="knkx-ksox-examples.html">KNKX–KSOX</a></p></noscript>
<script>
const buttons=Array.from(document.querySelectorAll('button[data-pair]'));
function selectPair(pair,focus=false){
 document.getElementById('view-link').href='full-report.html#'+pair;
 if(!buttons.some(b=>b.dataset.pair===pair))pair='knkx-ksox';
 for(const b of buttons){const active=b.dataset.pair===pair;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;
 const panel=document.getElementById(b.getAttribute('aria-controls'));panel.hidden=!active;
 if(active){const frame=panel.querySelector('iframe');if(!frame.hasAttribute('src'))frame.src=frame.dataset.src;if(focus)b.focus();}}
}
for(const b of buttons)b.addEventListener('click',()=>{location.hash=b.dataset.pair;selectPair(b.dataset.pair);});
document.querySelector('[role="tablist"]').addEventListener('keydown',e=>{
 if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();
 let i=buttons.findIndex(b=>b.getAttribute('aria-selected')==='true');
 i=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
 location.hash=buttons[i].dataset.pair;selectPair(buttons[i].dataset.pair,true);
});
window.addEventListener('hashchange',()=>selectPair(location.hash.slice(1)));
selectPair(location.hash.slice(1));
</script></body></html>
