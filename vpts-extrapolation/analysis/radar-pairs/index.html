<!doctype html>
<html lang="en" data-radar-pair-tabs>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar profile comparisons — Examples</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#263238;background:white}
header{height:66px;display:flex;align-items:center;gap:20px;padding:8px 20px;border-bottom:1px solid #d5dde3;background:#f8fafb}
nav{display:flex;gap:8px}button{font:inherit;font-weight:600;font-size:16px;padding:10px 18px;border:1px solid #aebcc8;border-radius:6px;background:white;color:#24516c;cursor:pointer}
button[aria-selected="true"]{background:#24516c;color:white;border-color:#24516c}
button:focus-visible,a:focus-visible{outline:3px solid #e69f00;outline-offset:3px}
.mode{margin-left:auto;font-size:14px;color:#24516c}iframe{display:block;border:0;width:100%;height:calc(100vh - 66px);height:calc(100dvh - 66px)}
[hidden]{display:none!important}
@media(max-width:800px){header{height:106px;flex-wrap:wrap;gap:4px;padding:8px}nav{max-width:100%;overflow-x:auto;white-space:nowrap}.mode{margin-left:8px}button{padding:9px 12px}iframe{height:calc(100vh - 106px);height:calc(100dvh - 106px)}}
</style></head>
<body><header>
<nav role="tablist" aria-label="Radar pair">
<button id="tab-knkx-ksox" role="tab" aria-selected="false" aria-controls="panel-knkx-ksox" data-pair="knkx-ksox">KNKX → KSOX</button>
<button id="tab-kdax-kmux" role="tab" aria-selected="false" aria-controls="panel-kdax-kmux" data-pair="kdax-kmux">KDAX → KMUX</button>
<button id="tab-klgx-krtx" role="tab" aria-selected="false" aria-controls="panel-klgx-krtx" data-pair="klgx-krtx">KLGX → KRTX</button>
</nav><a class="mode" id="view-link" href="full-report.html">All nights and methods</a>
</header>
<main>
<section id="panel-knkx-ksox" role="tabpanel" aria-labelledby="tab-knkx-ksox" hidden><iframe title="KNKX–KSOX Examples" data-src="knkx-ksox-examples.html"></iframe></section>
<section id="panel-kdax-kmux" role="tabpanel" aria-labelledby="tab-kdax-kmux" hidden><iframe title="KDAX–KMUX Examples" data-src="kdax-kmux-examples.html"></iframe></section>
<section id="panel-klgx-krtx" role="tabpanel" aria-labelledby="tab-klgx-krtx" hidden><iframe title="KLGX–KRTX Examples" data-src="klgx-krtx-examples.html"></iframe></section>
</main>
<noscript><p><a href="knkx-ksox-examples.html">KNKX–KSOX</a> · <a href="kdax-kmux-examples.html">KDAX–KMUX</a> · <a href="klgx-krtx-examples.html">KLGX–KRTX</a></p></noscript>
<script>
const buttons=Array.from(document.querySelectorAll('[role="tab"]'));
function selectPair(pair,focus=false){
 if(!buttons.some(b=>b.dataset.pair===pair))pair='knkx-ksox';
 for(const b of buttons){const active=b.dataset.pair===pair;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;
 const panel=document.getElementById(b.getAttribute('aria-controls'));panel.hidden=!active;
 if(active){const frame=panel.querySelector('iframe');if(!frame.hasAttribute('src'))frame.src=frame.dataset.src;if(focus)b.focus();}}
 document.getElementById('view-link').href='full-report.html#'+pair;
}
for(const b of buttons)b.addEventListener('click',()=>{location.hash=b.dataset.pair;selectPair(b.dataset.pair);});
document.querySelector('[role="tablist"]').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();
 let i=buttons.findIndex(b=>b.getAttribute('aria-selected')==='true');
 i=e.key==='Home'?0:e.key==='End'?buttons.length-1:(i+(e.key==='ArrowRight'?1:-1)+buttons.length)%buttons.length;
 location.hash=buttons[i].dataset.pair;selectPair(buttons[i].dataset.pair,true);});
window.addEventListener('hashchange',()=>selectPair(location.hash.slice(1)));
selectPair(location.hash.slice(1));
</script></body></html>
