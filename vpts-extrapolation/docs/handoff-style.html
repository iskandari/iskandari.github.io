<style>
:root { --ink:#263340; --muted:#61717f; --accent:#446e9b; --rule:#dbe3e8; --wash:#f5f8fa; --font:'Open Sans',sans-serif; }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; scroll-padding-top:28px; }
/* Typography is supplied by the bundled Spacelab theme. */
.main-container { max-width:1380px !important; margin:0 auto; padding:52px 42px 90px 340px; }
h1 { margin-bottom:28px; padding-bottom:24px; border-bottom:2px solid var(--accent); }
h2 { margin-top:46px; padding-bottom:11px; border-bottom:1px solid var(--rule); }
h3 { margin-top:30px; }
a { color:var(--accent); text-decoration:none; text-underline-offset:3px; overflow-wrap:anywhere; }
a:hover { text-decoration:underline; }
a:focus-visible,summary:focus-visible,.table-scroll:focus-visible { outline:2px solid var(--accent); outline-offset:4px; }
.skip-link { position:fixed; top:-80px; left:20px; z-index:100; padding:10px 18px; background:white; border:1px solid var(--accent); }
.skip-link:focus { top:12px; }
#TOC { position:fixed; top:42px; left:max(24px,calc((100vw - 1380px)/2 + 30px)); width:258px; max-height:calc(100vh - 80px); overflow-y:auto; padding:14px 16px 14px 0; border:1px solid #c4ccd4; border-radius:5px; background:linear-gradient(#fafbfc,#edf0f3); box-shadow:0 1px 3px #0000000d; padding:16px; font-size:13px; line-height:1.5; scrollbar-width:thin; }
#TOC summary { cursor:pointer; color:#223f50; font-weight:700; padding:0 0 12px; }
#TOC ul { list-style:none; padding:0; margin:0; }
#TOC li { margin:0; padding:0; }
#TOC a { color:#4c5c69; display:block; padding:7px 10px; border-left:2px solid transparent; }
#TOC a:hover { background:#f3f7f8; color:var(--accent); text-decoration:none; }
#TOC a.is-active { color:var(--accent); border-left-color:var(--accent); background:#e8eff6; font-weight:700; }
#TOC .toc-branch summary { font-weight:400; padding:0; display:flex; align-items:baseline; }
#TOC .toc-branch summary::before { content:'›'; width:11px; flex-shrink:0; color:#7c8c97; }
#TOC .toc-branch[open] > summary::before { content:'⌄'; }
#TOC .toc-branch summary::-webkit-details-marker { display:none; }
#TOC .toc-branch summary a { flex:1; padding-left:0; }
#TOC .toc-branch > ul { padding:0 0 6px 12px; font-size:12px; }
#TOC .toc-branch > ul a { padding:5px 10px; }
.callout { padding:18px 22px; margin:0 0 30px; background:#eef3f8; border-left:3px solid var(--accent); }
.callout p:last-child { margin-bottom:0; }
.table-scroll { max-width:100%; overflow-x:auto; margin:24px 0 28px; border-top:2px solid #bcced7; border-bottom:1px solid #cbd8df; }
table,.table { width:100%; border-collapse:collapse; table-layout:auto;  margin:0; }
.table > thead > tr > th,.table > tbody > tr > td,th,td { padding:11px 12px; vertical-align:top; border:0; border-bottom:1px solid #e3e9ed; text-align:left; font-weight:400; }
th { background:linear-gradient(#f5f7fa,#e5ebf1); color:#294556; font-weight:700; vertical-align:bottom; border-bottom:1px solid #c8d6de; }
tbody tr:nth-child(even) { background:#fafbfc; }
tbody tr:last-child td { border-bottom:0; }
th[align='left'],td[align='left'],th[style*='left'],td[style*='left'] { text-align:left !important; }
th[align='right'],td[align='right'],th[style*='right'],td[style*='right'],.numeric { text-align:right !important; font-variant-numeric:tabular-nums lining-nums; }
td.numeric,td[align='right'],td[style*='right'] { white-space:nowrap; }
.metrics-table th:first-child,.metrics-table td:first-child { min-width:160px; }
.metrics-table .group-start td { border-top:2px solid #c9d7df; }
.best { font-weight:700; color:#245b35; background:#e0efdf; padding:0; border-radius:2px; box-shadow:3px 0 #e0efdf,-3px 0 #e0efdf; }

code { white-space:normal; color:#37566b; background:#f0f4f6; padding:1px 3px; overflow-wrap:anywhere; }
.main-container p > code,.main-container li > code,.main-container td > code { white-space:normal !important; overflow-wrap:anywhere !important; word-break:break-word; }
pre { padding:16px 18px; margin:20px 0; background:#f5f7f9; border:1px solid var(--rule); overflow-x:auto; line-height:1.65; }
pre code { white-space:pre; background:none; padding:0; font-size:12px; }
figure,.figure { margin:28px 0 32px; padding:0; }
figure img,.figure img,img { display:block; max-width:100%; height:auto; }
figcaption,.figcaption,.caption { color:#5b6c7a; font-size:12px; line-height:1.75; border-top:1px solid var(--rule); padding-top:12px; margin-top:12px; text-align:left; }
ul,ol { padding-left:24px; margin:12px 0 20px; }
li { margin:7px 0; }
@media(max-width:1100px) { .main-container { padding-left:292px; padding-right:28px; } #TOC { left:20px; width:235px; } }
@media(max-width:900px) { .main-container { padding:26px 24px 54px; max-width:820px !important; } #TOC { position:relative; top:auto; left:auto; width:100%; max-height:65vh; border:1px solid var(--rule); padding:13px 16px; margin:0 0 28px; } #TOC > details > summary { padding:0; } #TOC > details[open] > summary { padding-bottom:12px; } }
@media(max-width:540px) { .main-container { padding:20px 18px 44px; } table { min-width:560px; } th,td { padding:9px 10px; } .callout { padding:15px 16px; } }
@media(prefers-reduced-motion:reduce) { html { scroll-behavior:auto; } }
@media print { body { font-size:10pt; } .main-container { max-width:none !important; margin:0; padding:0; } #TOC,.skip-link { display:none; } h1 { font-size:23pt; } h2 { font-size:16pt; } h2,h3 { break-after:avoid; } tr,figure,.figure { break-inside:avoid; } thead { display:table-header-group; } .table-scroll { overflow:visible; } table { font-size:8pt; min-width:0; } th,td { padding:6px; } .best,th { print-color-adjust:exact; -webkit-print-color-adjust:exact; } }
</style>
<script>
document.addEventListener('DOMContentLoaded',function(){
  var main=document.querySelector('.section.level1');
  if(main) main.setAttribute('role','main');
  var toc=document.querySelector('#TOC');
  if(toc){
    toc.setAttribute('role','navigation');toc.setAttribute('aria-label','Table of contents');
    var root=toc.querySelector('details > ul');
    if(root && root.children.length===1){
      var sections=root.firstElementChild.querySelector('ul');
      if(sections)root.replaceWith(sections);
    }
    toc.querySelectorAll('li').forEach(function(li){
      var list=Array.from(li.children).find(function(x){return x.tagName==='UL'});
      var link=Array.from(li.children).find(function(x){return x.tagName==='A'});
      if(list&&link){var d=document.createElement('details'),s=document.createElement('summary');d.className='toc-branch';s.appendChild(link);d.appendChild(s);d.appendChild(list);li.appendChild(d);}
    });
    if(window.matchMedia('(max-width:900px)').matches)toc.querySelector('details').open=false;
    var links=Array.from(toc.querySelectorAll('a')), headings=links.map(function(a){return document.getElementById(decodeURIComponent(a.hash.slice(1)))});
    function mark(){var current=0;headings.forEach(function(h,i){if(h&&h.getBoundingClientRect().top<=100)current=i});links.forEach(function(a,i){a.classList.toggle('is-active',i===current);if(i===current){a.setAttribute('aria-current','location');var branch=a.closest('details.toc-branch');if(branch)branch.open=true;}else a.removeAttribute('aria-current')});}
    var scheduled=false;window.addEventListener('scroll',function(){if(!scheduled){scheduled=true;requestAnimationFrame(function(){mark();scheduled=false})}},{passive:true});mark();
  }
  document.querySelectorAll('.main-container table').forEach(function(table){
    table.querySelectorAll('colgroup').forEach(function(c){c.remove()});
    var headings=Array.from(table.querySelectorAll('thead th'));
    headings.forEach(function(th,i){
      var label=th.textContent.trim();
      var numeric=/^(k|Count|Number|Depth|Rows|Sites|Contributing sites|Expanded target rows|Best round|Min child weight|R²|RMSE|Bias|L2|Stopping|Equal-site)/.test(label)||th.getAttribute('align')==='right'||th.style.textAlign==='right';
      if(numeric){th.classList.add('numeric');table.querySelectorAll('tbody tr').forEach(function(row){if(row.cells[i])row.cells[i].classList.add('numeric')});}
    });
    if(table.querySelectorAll('tbody tr').length===24){table.classList.add('metrics-table');var last='';table.querySelectorAll('tbody tr').forEach(function(row){var group=row.cells[0].textContent.trim();if(last&&group!==last)row.classList.add('group-start');last=group;});}
    var wrapper=document.createElement('div');wrapper.className='table-scroll';wrapper.tabIndex=0;wrapper.setAttribute('role','region');wrapper.setAttribute('aria-label','Scrollable report table');table.parentNode.insertBefore(wrapper,table);wrapper.appendChild(table);
  });
});
</script>
